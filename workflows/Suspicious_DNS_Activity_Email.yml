name: Suspicious DNS Activity Email
description: Weekly email for devices with suspicious DNS activity
multi_instance: true
parameters:
    actions:
        configuration:
            SendEmail:
                properties:
                    to:
                        required: true
provision_on_install: true
trigger:
    type: Scheduled
    next:
        - CIDSpecificEventQuerySuspiciousDNSQueries
    event: Schedule
    name: Scheduled workflow
    schedule:
        time_cycle: 34 16 * * 4
        start_date: ""
        end_date: ""
        tz: America/Los_Angeles
        skip_concurrent: false
    version_constraint: ~1
actions:
    CIDSpecificEventQuerySuspiciousDNSQueries:
        id: logscale_saved_search.Suspicious DNS Queries
        default_name: CID-specific event query - Suspicious DNS Queries
        name: CID-specific event query - Suspicious DNS Queries
        next:
            - event_count_is_greater_than_0
        properties:
            aid: '*'
            output_files_only: false
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~0
    SendEmail:
        id: 07413ef9ba7c47bf5a242799f59902cc
        default_name: Send email
        name: Send email
        properties:
            _fields:
                - ${CIDSpecificEventQuerySuspiciousDNSQueries.raw_results}
            msg: Rarely seen domains from this week's hunt are included below.
            msg_type: text
            subject: Suspicious DNS Activity - Weekly Report
        version_constraint: ~1
conditions:
    event_count_is_greater_than_0:
        next:
            - SendEmail
        expression: CIDSpecificEventQuerySuspiciousDNSQueries.event_count:>0
        display:
            - Event count is greater than 0
