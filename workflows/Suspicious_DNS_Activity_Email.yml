name: Suspicious DNS Activity Email
description: Weekly email listing rarely seen domains across every host
multi_instance: true
parameters:
    actions:
        configuration:
            SendEmail:
                properties:
                    to:
                        required: true
provision_on_install: true
trigger:
    type: Scheduled
    event: Schedule
    next:
        - EventQuery
    schedule:
        time_cycle: 34 16 * * 4
        start_date: ""
        end_date: ""
        tz: America/Los_Angeles
        skip_concurrent: false
actions:
    EventQuery:
        id: logscale_saved_search.Suspicious DNS Queries
        name: Suspicious DNS Queries
        version_constraint: ~0
        next:
            - has_results
        properties:
            aid: '*'
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
    SendEmail:
        id: 07413ef9ba7c47bf5a242799f59902cc
        name: Send email
        version_constraint: ~1
        properties:
            subject: Suspicious DNS Activity - Weekly Report
            msg: |
                Rarely seen domains from this week's hunt:

                ${data['EventQuery.raw_results']}
conditions:
    has_results:
        cel_expression: data['EventQuery.results'].size() > 0
        next:
            - SendEmail
